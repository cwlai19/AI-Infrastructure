# Source directory: every public and paid source we know of for European credit and restructuring work,
# by jurisdiction and by what it tells you. The tracker reads it for `python -m tracker sources` and
# `python -m tracker search <jurisdiction> "<name>"`; scripts/build_source_directory.py turns it into a page.
#
# Resource fields:
#   jurisdiction  a key of `jurisdictions` below
#   channels      what the source tells you (keys of `channels`)
#   access        a key of `access_levels`
#   api           api | bulk | feed | web (how a machine can read it; web = a person in a browser)
#   automation    ok (documented API or bulk data) | limited (allowed within stated limits) | manual (browse only:
#                 terms forbid scraping, or no stable interface)
#   url           landing page
#   search_url    optional: a search page with {q} where the company name goes (one-click lookups)
#   id_url        optional: a company page with {id} where a registry number goes
#   adapter       optional: a live search adapter in tracker/jurisdictions.py
#   what          what it gives a credit analyst, in one line
#   notes         limits, licences, gotchas
#   gap           true for an entry that records that NO public source exists for a channel (shown as a gap)
# Facts about access and limits were checked on 29 Oct 2026; re-check a source's terms before automating it.

channels:
  registry: Company register (existence, officers, filings list, status)
  accounts: Filed annual accounts and financial statements
  security: Charges, pledges and mortgages (who has security over what)
  land: Land and property registers (owners, mortgages on sites)
  insolvency: Insolvency and restructuring notices and registers
  judgments: Court judgments (plan sanctions, schemes, examinership, WHOA)
  markets: Regulated disclosures, prospectuses, exchange announcements
  bonds: Bond terms, trustee and bondholder notices
  lenders: Lender and fund disclosures (holdings, terms)
  state: Public lenders, export credit agencies, state aid
  ownership: Legal entity identifiers, group structures, beneficial owners
  aggregator: Third-party databases that collect several of the above
  news: News and deal intelligence
  sector: Data-centre and sector databases

access_levels:
  free: Free, no account
  free_key: Free with registration or an API key
  free_limited: Free, but rate-limited, partial, or legitimate-interest only
  pay_per_doc: Search free; documents or extracts cost a fee each
  freemium: Some free use; full data or API paid
  subscription: Paid subscription

jurisdictions:
  uk:
    name: United Kingdom (England & Wales)
    country: GB
    aliases: [gb, england, ew, britain]
    regimes: "Part 26A restructuring plan (cross-class cram-down); Part 26 scheme of arrangement; administration (incl. pre-pack); CVA; liquidation"
  ie:
    name: Ireland
    country: IE
    aliases: [irl, eire]
    regimes: "Examinership; SCARP (small companies); scheme of arrangement; receivership; liquidation"
  lu:
    name: Luxembourg
    country: LU
    aliases: [lux, luxembourg]
    regimes: "Judicial reorganisation (2023 law: amicable agreement, collective agreement, transfer by court order); bankruptcy (faillite). Home of many holdco/bidco and fund vehicles"
  nl:
    name: Netherlands
    country: NL
    aliases: [nld, holland, dutch]
    regimes: "WHOA (public or undisclosed/besloten) with cross-class cram-down; suspension of payments (surseance); bankruptcy (faillissement)"
  de:
    name: Germany
    country: DE
    aliases: [deu, ger, germany]
    regimes: "StaRUG restructuring plan (public only if the debtor applies); insolvency (incl. self-administration/Eigenverwaltung, protective shield/Schutzschirm); SchVG bondholder votes"
  fr:
    name: France
    country: FR
    aliases: [fra, france]
    regimes: "Conciliation and mandat ad hoc (confidential); sauvegarde and sauvegarde accélérée (classes, cross-class cram-down since 2021); redressement and liquidation judiciaire"
  es:
    name: Spain
    country: ES
    aliases: [esp, spain]
    regimes: "Restructuring plan (plan de reestructuración, 2022 reform, cross-class cram-down); concurso de acreedores; pre-insolvency notice (comunicación de apertura de negociaciones)"
  it:
    name: Italy
    country: IT
    aliases: [ita, italy]
    regimes: "Composizione negoziata (confidential); accordi di ristrutturazione; PRO (piano di ristrutturazione soggetto a omologazione); concordato preventivo; liquidazione giudiziale"
  "no":
    name: Norway
    country: "NO"
    aliases: [nor, norway]
    regimes: "Reconstruction (rekonstruksjon); bankruptcy (konkurs); Nordic bond written procedures via the bond trustee"
  se:
    name: Sweden
    country: SE
    aliases: [swe, sweden]
    regimes: "Company reconstruction (företagsrekonstruktion, 2022 reform with plans and classes); bankruptcy (konkurs); Nordic bond written procedures"
  dk:
    name: Denmark
    country: DK
    aliases: [dnk, denmark]
    regimes: "Reconstruction (rekonstruktion); bankruptcy (konkurs)"
  fi:
    name: Finland
    country: FI
    aliases: [fin, finland]
    regimes: "Corporate restructuring (yrityssaneeraus); bankruptcy (konkurssi)"
  eu:
    name: Pan-European
    aliases: [europe, pan-eu, eea]
    regimes: "EU Restructuring Directive (2019/1023) frameworks; Insolvency Regulation (recast) for cross-border recognition"
  us:
    name: United States (for European borrowers and US recognition)
    country: US
    aliases: [usa, sec, edgar]
    regimes: "Chapter 11; Chapter 15 recognition of foreign proceedings (UK plans, Dutch WHOA, etc. often file here)"
  global:
    name: Global paid and sector databases
    aliases: [paid, vendors, world]
    regimes: ""

resources:

  # ---------------- United Kingdom ----------------
  - id: uk_ch
    jurisdiction: uk
    name: Companies House (API and website)
    channels: [registry, accounts, security, insolvency]
    access: free_key
    api: api
    automation: ok
    url: https://find-and-update.company-information.service.gov.uk/
    search_url: https://find-and-update.company-information.service.gov.uk/search?q={q}
    id_url: https://find-and-update.company-information.service.gov.uk/company/{id}
    adapter: uk_ch
    what: "Profiles, filing history, charges (MR01 often attaches the full security instrument), accounts, administrators' proposals (AM03) and statements of affairs listing creditors"
    notes: "600 requests per 5 minutes per key. Filed PDFs via the Document API. Free bulk products: basic company data, daily accounts (iXBRL), PSC snapshot"
  - id: uk_ch_stream
    jurisdiction: uk
    name: Companies House Streaming API
    channels: [registry, security, insolvency]
    access: free_key
    api: feed
    automation: ok
    url: https://developer-specs.company-information.service.gov.uk/streaming-api/guides/overview
    what: "Push stream of every change (filings, charges, insolvency cases, officers) across all UK companies"
    notes: "Better than polling once you watch hundreds of SPVs; needs a separate stream key"
  - id: uk_gazette
    jurisdiction: uk
    name: The Gazette (insolvency notices)
    channels: [insolvency]
    access: free
    api: feed
    automation: ok
    url: https://www.thegazette.co.uk/insolvency
    search_url: https://www.thegazette.co.uk/all-notices/notice?text={q}
    adapter: uk_gazette
    what: "Winding-up petitions, administrator and liquidator appointments, creditor meetings, dividends: the official record of UK insolvency events"
    notes: "Every search page has Atom/JSON data feeds (add /data.feed)"
  - id: uk_caselaw
    jurisdiction: uk
    name: Find Case Law (The National Archives)
    channels: [judgments]
    access: free
    api: api
    automation: limited
    url: https://caselaw.nationalarchives.gov.uk/
    search_url: https://caselaw.nationalarchives.gov.uk/search?query={q}
    adapter: uk_caselaw
    what: "Convening and sanction judgments for Part 26A plans and schemes, administration and insolvency judgments: class composition, cram-down reasoning, creditor objections"
    notes: "Reading and searching are free under the Open Justice Licence; computational analysis at scale needs a (free) transactional licence from TNA"
  - id: uk_nsm
    jurisdiction: uk
    name: FCA National Storage Mechanism
    channels: [markets, bonds]
    access: free
    api: web
    automation: manual
    url: https://data.fca.org.uk/#/nsm/nationalstoragemechanism
    what: "Regulated announcements, annual reports and prospectuses of UK-listed issuers, including bond-only issuers"
  - id: uk_rns
    jurisdiction: uk
    name: London Stock Exchange RNS
    channels: [markets, bonds]
    access: free
    api: web
    automation: manual
    url: https://www.londonstockexchange.com/news?tab=news-explorer
    what: "Regulatory news for LSE issuers and listed credit funds (e.g. portfolio updates of listed lenders)"
    notes: "Machine feeds are a paid LSEG product"
  - id: uk_land_registry
    jurisdiction: uk
    name: HM Land Registry
    channels: [land, security]
    access: pay_per_doc
    api: bulk
    automation: ok
    url: https://use-land-property-data.service.gov.uk/
    what: "Title registers show owner and registered charges (lender) on data-centre land; free bulk lists of UK and overseas companies that own property in England and Wales"
    notes: "Bulk ownership datasets free with an account; individual title registers cost a fee each"
  - id: uk_subsidy
    jurisdiction: uk
    name: UK Subsidy Database
    channels: [state]
    access: free
    api: web
    automation: manual
    url: https://searchforuksubsidies.beis.gov.uk/
    what: "Public subsidies and grants awarded to named companies"
  - id: uk_ukef
    jurisdiction: uk
    name: UK Export Finance (business supported)
    channels: [state, lenders]
    access: free
    api: web
    automation: manual
    url: https://www.gov.uk/government/organisations/uk-export-finance
    what: "Guarantees and loans UKEF has supported, by buyer and amount (annual report 'business supported' lists and announcements)"

  # ---------------- Ireland ----------------
  - id: ie_cro_open
