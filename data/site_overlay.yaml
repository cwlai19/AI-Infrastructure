# Presentation overlay for the site map. Facts live in statements.csv; this file holds only
# (1) approximate town-level coordinates, (2) which facilities are tied to which site where the
# statements don't say so directly, and (3) analyst construction-risk ratings, which are
# judgements, not facts. Each rating lists its drivers and the statements/sources behind them.
#
# Risk scale (construction / delivery risk, not credit quality of the customer):
#   low       powered and delivering, no adverse reports
#   medium    built or powered, but a dated condition or regulatory step is outstanding
#   high      live delays, incidents or a regulatory notice on a site under construction
#   critical  no power yet, permits contested, timeline slipping, and a large contract depends on it
#   terminated  customer contract ended
rated_by: "claude (pending analyst review)"
rated_date: "2026-10-29"
sites:
  site_ward_county:   {lat: 31.60, lon: -103.10, region: us, label: "Ward County, TX", risk: medium,
                       facilities: [fac_ward_county, fac_dell_vendor],
                       drivers: ["Powered leased site (Ionic, 234 MW); existing capacity not affected so far",
                                 "Texas governor's audit of ERCOT's large-load queue gates Ionic's 466 MW expansion and Nscale's +89 MW option",
                                 "Loan can only be drawn on commissioning, power and hedges; Dell bridge (~$2.54B, shared with NC) must be refinanced from it"]}
  site_north_carolina: {lat: 35.83, lon: -82.55, region: us, label: "NC-1, Madison County, NC", risk: low,
                       facilities: [fac_north_carolina, fac_dell_vendor],
                       drivers: ["Switchgear delay at NC-1 reported resolved by WhiteFiber; 40 MW run-rate billing targeted end-Aug 2026 (not confirmed)",
                                 "Colocation: WhiteFiber depends on Nscale as sole tenant"]}
  site_monarch:       {lat: 38.85, lon: -82.13, region: us, label: "Monarch, Mason County, WV", risk: critical,
                       facilities: [],
                       drivers: ["No grid power: depends on an on-site 2,160 MW gas plant whose air permits were refiled",
                                 "DEP stormwater enforcement order (July 2026); contested hearings, tax-break debate and a preservation dispute (Oct 2026)",
                                 "Phase one now 'early 2028' vs an earlier January 2027",
                                 "Anthropic ($44.6B signed, ~$45B more in talks) pays only on delivery and can terminate late tranches; financing not secured"]}
  site_glomfjord:     {lat: 66.81, lon: 13.95, region: eu, label: "Glomfjord, Norway", risk: high,
                       facilities: [fac_macquarie_glomfjord],
                       drivers: ["~6 months late: 6.4 of 30 MW running (Bloomberg, 15 Oct 2026)",
                                 "Repeated liquid-cooling leaks; transformer fire Dec 2025 with 10 safety violations (closed Sept 2026)",
                                 "Delay penalties reportedly owed; customer Spring (SG) is a ByteDance subsidiary (regulatory/reputational risk)"]}
  site_kvandal_south: {lat: 68.38, lon: 17.15, region: eu, label: "Kvandal South, Narvik", risk: high,
                       facilities: [fac_norway_term_loan, fac_norway_vat_rcf],
                       drivers: ["Under construction; NVE threatens a coercive fine unless a waste-heat analysis is filed by 15 Nov 2026",
                                 "Reported local opposition in Narvik",
                                 "Project loan assumes completion by 5 Apr 2027 (VAT facility long-stop 30 Jun 2027)"]}
  site_kvandal_north: {lat: 68.55, lon: 17.55, region: eu, label: "Kvandal North, Narvik", risk: unrated, label_dy: -14,
                       facilities: [],
                       drivers: ["Not rated: no construction status, MW or delivery dates disclosed",
                                 "Microsoft SOW filed (Ex-10.19) with tranche sizes, prices and dates redacted"]}
  site_borealis:      {lat: 65.66, lon: -20.28, region: eu, label: "Borealis, Blönduós, Iceland", risk: medium,
                       facilities: [fac_macquarie_iceland],
                       drivers: ["Third-party colocation; no adverse reports found",
                                 "Service must commence by 27 Jan 2027 or the Macquarie loan defaults (per CCIR)"]}
  site_sin01:         {lat: 37.96, lon: -8.86, region: eu, label: "Sines SIN01, Portugal", risk: low, label_dy: 16,
                       facilities: [],
                       drivers: ["Active: 12,600+ GB300 GPUs deployed for Microsoft; Portugal was 52% of H1 2026 revenue",
                                 "Colocation at Start Campus; no adverse reports found"]}
  site_sin02:         {lat: 37.92, lon: -8.80, region: eu, label: "Sines SIN02, Portugal", risk: medium, label_dy: -10,
                       facilities: [],
                       drivers: ["Development site: 66,000+ Vera Rubin GPUs for Microsoft from late 2027",
                                 "€377.8M of purchase price still owed to the seller, mostly H2 2026",
                                 "No adverse reports found (Oct 2026 digital-twin pilot with Schneider/NVIDIA)"]}
  site_loughton:      {lat: 51.65, lon: 0.07, region: eu, label: "Loughton, UK", risk: terminated,
                       facilities: [],
                       drivers: ["Microsoft terminated (Oct 2026): grid power not available until the early-to-mid 2030s",
                                 "Nscale says it is exploring alternative power; site value to Nscale unclear"]}
corporate_facilities:
  fac_uk_gpu_ddtl: "Secured on GPUs across European clusters (Glomfjord named; Icelandic and Portuguese security referenced), not one site"
  fac_parent_rcf: "Group revolver"
  fac_convertible_2026: "Group-level unsecured convertible"
  fac_committed_2_35b: "Bank commitments subject to documentation; use not disclosed"

# Counterparty view. Facts are pulled from the tracker; 'read' is analyst judgement (pending review), shown as such.
# headline: the one contract whose value stands for that customer (Microsoft's site contracts sit inside its aggregate).
customers:
  le_microsoft:
    headline: ctr_msft_sows
    read:
      - "Strongest payer on the book; the risk is walk-away, not payment. It already exited Loughton (UK) after grid delays."
      - "Termination is for cause (60 days' notice) or insolvency, so Nscale's own delivery is the main lever Microsoft holds."
      - "Revenue today is mostly Microsoft at Sines: the largest customer was 52% of H1 2026 revenue and Portugal 52%."
  le_anthropic:
    headline: ctr_anthropic
    read:
      - "Largest single backlog ($44.6B) but not take-or-pay: Anthropic pays on delivery and can drop late or under-performing tranches."
      - "All of it sits on one campus (Monarch) that is pre-construction, with financing not secured."
      - "A second ~$45B building is in talks (news only). It would deepen, not diversify, the Monarch and Anthropic concentration."
  le_nvidia:
    headline: ctr_nvidia_msa
    read:
      - "Also a shareholder (>5%) and guarantor of $860M of the Ward County rent, so it supports Nscale from three sides."
  le_spring_sg:
    headline: ctr_spring_glomfjord
    read:
      - "Was 73% of 2025 revenue. Fee per GPU-hour redacted; Glomfjord's Macquarie loan depends on this contract."
  le_figure:
    headline: ctr_figure
    read:
      - "100,000 GPUs but no value disclosed and no site named, so it cannot yet be tied to an asset or a loan."

# Upstream view per campus: who Nscale depends on for the building and power shell.
upstream:
  site_ward_county:
    counterparty: le_ionic
    lease: lease_ward_county
    read:
      - "Mutual dependence: Ionic's growth business is this one lease, and its subsidiary KiNRG gets 86% of revenue from Nscale."
      - "Strong credit support for the landlord: NVIDIA guarantees $860M of rent for five years plus a $470M escrow."
      - "Nscale must take a further 89 MW if Ionic delivers it, a contingent obligation with no penalty on Ionic if it cannot."
  site_north_carolina:
    counterparty: le_whitefiber
    lease: lease_nc1
    read:
      - "Nscale is WhiteFiber's sole contracted tenant at NC-1, so the landlord's credit is tied to Nscale's."
  site_borealis:
    read:
      - "Third-party colocation; the operator is not named in the Macquarie facility. Customer redacted; service must start by 27 Jan 2027."
  site_sin01:
    read:
      - "Colocation; the landlord is not named in the S-1. Generates most current revenue (Portugal 52% of H1 2026)."
  site_sin02:
    read:
      - "Owned, but $430.7M of the purchase price is still owed to the seller: an upstream payable that ranks alongside the build cost."
  site_monarch:
    read:
      - "Owned land ($792.6M acquisition). No landlord risk; the upstream risk is the on-site gas plant and its permits."
  site_kvandal_south:
    read:
      - "Came in through the Aker JV, rolled up into Nscale in March 2026. No landlord disclosed; NVE fine notice pending (deadline 15 Nov 2026)."
  site_kvandal_north:
    read:
      - "Microsoft site in Narvik held through Nscale's Kvandal North subsidiaries; no landlord, lease or loan filed."
  site_glomfjord:
    read:
      - "Owned. No landlord; the risk is delivery: about six months late, with delay penalties reportedly owed to the customer."
  site_loughton:
    read:
      - "Terminated: the grid connection was not expected until 2033."

# If a campus is late: where its cash flow stands, and an analyst read of what lateness does to customer and lender.
# Facts (contract and loan clauses) come from the tracker; this is judgement (pending review).
if_late:
  site_monarch:
    stage: pre_revenue
    read:
      - "No Anthropic payment until each tranche is accepted. Lateness first costs fee-free months, then discounts, then Anthropic can cancel the tranche."
      - "Financing is a condition: if it is not in place by the (redacted) longstop either side can walk, and until then Nscale cannot sell the capacity to anyone else."
      - "No project loan yet, so a delay hits Nscale's own cash (the $792.6M land purchase and early works), not a lender."
  site_ward_county:
    stage: contracted
    read:
      - "If Microsoft's terms match the one filed SOW, it can cancel any tranche not accepted 60 days after its due date and take back that tranche's upfront payment."
      - "The loan then needs that tranche's debt repaid within 60 days. Nscale's parent has first offer to buy the assets at loan value, so parent cash is the real backstop."
      - "Cancelling the whole contract is a loan default; above $50M that appears to reach the group revolver."
  site_north_carolina:
    stage: earning
    read:
      - "Earning and ramping. The (redacted) customer ending its contract is an immediate loan default: no replacement window and no residual value guarantee."
      - "Force majeure must last 45 days before either side can walk (amended at the lenders' request)."
  site_kvandal_south:
    stage: building
    read:
      - "Target completion 5 Apr 2027; the loan defaults if not complete by 5 Apr 2028, or if work stops for 60 days in a row."
      - "Cost overruns must be paid in with equity or shareholder debt within 15 business days, so delays cost Nscale cash before they cost lenders."
      - "If Microsoft walks, cash is trapped at once and the loan defaults after a year (18 months if a replacement is being negotiated). Nscale Limited guarantees it."
  site_kvandal_north:
    stage: building
    read:
      - "Microsoft gets a credit of a full day's bill for every day late, and can cancel any tranche 60 days late with its upfront payment refunded."
      - "No project loan has been filed for this site."
  site_glomfjord:
    stage: earning
    read:
      - "Live but about six months late. The loan required service to start by 30 Nov 2025; whether that was met or waived is not filed."
      - "If Spring walks, Nscale has two months to sign a replacement customer before it is a loan default."
  site_borealis:
    stage: contracted
    read:
      - "Nearest hard deadline in the book: service due 17 Nov 2026, and the Macquarie loan defaults if it has not started by 27 Jan 2027."
      - "The customer's payments are guaranteed by two (redacted) guarantors; a lost customer must be replaced within 60 days."
  site_sin01:
    stage: earning
    read:
      - "Earning now (Portugal 52% of H1 2026 revenue). Microsoft can only end it for cause or insolvency."
  site_sin02:
    stage: contracted
    read:
      - "Due from late 2027. Lateness risk mirrors the Microsoft SOW: daily credits, then cancellation of tranches 60 days late."
      - "$430.7M of the purchase price is still owed to the seller whether or not the building is delivered."
  site_loughton:
    stage: terminated
    read:
      - "Shows the mechanism in practice: Microsoft walked when the grid connection slipped to the 2030s."
