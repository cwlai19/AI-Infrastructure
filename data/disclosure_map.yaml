  nl_bw2_403:
    title: Dutch Civil Code Book 2 (Art. 2:403 group exemption)
    url: https://wetten.overheid.nl/BWBR0003045/
    supports: "A parent's 403 declaration makes it jointly liable for the subsidiary's debts; deposited at the KVK"
