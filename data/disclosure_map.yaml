    checked: 2026-10-30

# Regions use the jurisdiction keys of the source directory. "nordics" expands to no, se, dk, fi.
instruments:

  - id: secured_loan
    name: Secured loan (bank or private credit term loan, delayed-draw, revolver, GPU-backed facility)
    in_this_sector: "Most neocloud GPU financings and data-centre construction and acquisition debt"
    traces:
      - region: uk
        status: mandatory
        evidence: law
        trace: "Charge registered: chargee (usually the security or collateral agent), assets, fixed/floating charge, negative pledge; the instrument is usually attached"
        timing: "Within 21 days of creation"
        where: [uk_ch, uk_ch_stream]
        detect: "company uk <no>; sector <preset> --jur uk; monitor (ch feed)"
        refs: [uk_ca2006_s859a, uk_ca2006_s859h, uk_ch_charges_stream]
      - region: ie
        status: mandatory
        evidence: law
        trace: "Charge particulars filed with the CRO"
        timing: "Within 21 days of creation"
        where: [ie_core]
        refs: [ie_ca2014_s409]
      - region: "no"
        status: conditional
        evidence: law
        trace: "Pledges over operating assets, receivables or inventory registered in Løsøreregisteret; mortgages on land in the land register. Share pledges are not registered."
        where: [no_losore, no_kartverket]
        refs: [no_panteloven]
      - region: se
        status: conditional
        evidence: law
        trace: "Business mortgage certificates registered with Bolagsverket (amount, not lender); real-estate mortgage deeds with Lantmäteriet"
        where: [se_bolagsverket, se_lantmateriet]
        refs: [se_foretagsinteckning]
      - region: dk
        status: conditional
        evidence: law
        trace: "Company charges (virksomhedspant) and real-estate mortgages registered in Tinglysning"
        where: [dk_tinglysning]
        refs: [dk_tinglysning]
      - region: fr
        status: conditional
        evidence: law
        trace: "Non-possessory pledges and business-asset pledges published on the security-interests register (RSM). Pledges over securities accounts (e.g. SAS shares) are perfected without it (our reading)"
        where: [fr_infogreffe]
        refs: [fr_rsm]
        note: "Whether a given pledge type must be registered depends on its legal form; check with French counsel"
      - region: es
        status: conditional
        evidence: law
        trace: "Chattel mortgages and non-possessory pledges in the Registro de Bienes Muebles; real-estate mortgages in the land registry"
        where: [es_registradores]
        refs: [es_hmpsd_1954]
      - region: lu
        status: none
        evidence: law
        trace: "Share and receivable pledges are not registered; real-estate mortgages are"
        where: [lu_hypotheques]
        refs: [lu_fcl_2005]
      - region: nl
        status: none
        evidence: judgement
        trace: "Undisclosed pledges are registered with the tax authority only to fix the date, not published; mortgages on land are in the Kadaster"
        where: [nl_kadaster]
      - region: de
        status: none
        evidence: judgement
        trace: "No public register for security transfers, assignments or share pledges; land charges are in the Grundbuch (legitimate interest needed)"
        where: [de_grundbuch]
      - region: us
        status: mandatory
        evidence: law
        trace: "UCC-1 financing statement naming the secured party (often the collateral agent) and the collateral; GPU-backed loans show here"
        timing: "At or before closing"
        where: [us_ucc]
        refs: [us_ucc9, us_delaware_ucc]
    never_public: "Amount (unless the instrument states it), pricing, covenants, lender syndicate behind the agent"

  - id: unsecured_holdco_loan
    name: Unsecured or holdco loan (incl. PIK holdco notes held privately, shareholder loans)
    in_this_sector: "Holdco and mezzanine financing above asset-level debt"
    traces:
      - region: all
        status: none
        evidence: judgement
        trace: "No registration anywhere. Appears only in the borrower's accounts (debt note), a US filer's exhibits, a listed lender's holdings, or reporting by news and paid services"
        where: [gl_9fin, gl_debtwire, gl_octus]
    never_public: "Almost everything until accounts are filed"

  - id: project_finance
    name: Data-centre construction or project finance loan
    in_this_sector: "Campus construction debt secured on land, buildings and contracts"
    traces:
      - region: all
        status: conditional
        evidence: law
        trace: "Mortgage on the site in the land register; share and account security as for secured loans in that country"
        where: [uk_land_registry, nl_kadaster, no_kartverket, se_lantmateriet, dk_tinglysning]
        refs: [uk_ca2006_s859a]
      - region: eu
        status: conditional
        evidence: regulator
        trace: "If a public lender (EIB, EBRD, NIB) or export credit agency takes part: borrower, amount and project published"
        where: [eu_eib, eu_ebrd, eu_nib, eu_eca]
    never_public: "Commercial lenders' shares, pricing, completion tests (unless the borrower files them)"

  - id: equipment_finance
    name: Equipment finance, GPU vendor financing, leases and sale-leasebacks
    in_this_sector: "GPU and server financing by vendors, leasing companies and private credit"
    traces:
      - region: uk
        status: conditional
        evidence: law
        trace: "Registered if the company grants a charge; a true lease or retention-of-title sale is not a charge and is not registered"
        where: [uk_ch]
        refs: [uk_ca2006_s859a]
      - region: us
        status: conditional
        evidence: law
        trace: "UCC-1 filings by lessors and vendors (precautionary filings are common)"
        where: [us_ucc]
        refs: [us_ucc9]
      - region: all
        status: conditional
        evidence: law
        trace: "Lease liabilities and purchase commitments appear in filed accounts or SEC filings, without counterparty names"
        where: [uk_ch, us_edgar_api]
    never_public: "Lessor identity outside the UCC and UK charges register"

  - id: listed_bond
    name: Listed bond (high yield, investment grade, green bond) on a regulated market or MTF
    in_this_sector: "Data-centre platforms with bond programmes; neocloud high-yield bonds"
    traces:
      - region: eu
        status: mandatory
        evidence: law
        trace: "Instrument reference data with issuer LEI, maturity and coupon published by ESMA (FIRDS); listing document on the exchange; inside information announcements"
        timing: "Reference data from admission to trading; announcements promptly"
        where: [eu_firds, lu_luxse, ie_euronext_dublin, de_boerse_frankfurt]
        refs: [eu_mifir, eu_firds, eu_mar, eu_prospectus]
      - region: uk
        status: mandatory
        evidence: law
        trace: "Listing document and regulatory announcements on the FCA National Storage Mechanism and RNS"
        where: [uk_nsm, uk_rns]
        refs: [uk_mar_17]
      - region: us
        status: conditional
        evidence: regulator
        trace: "Registered bonds: prospectus (424B), indenture (Exhibit 4), guarantors (Exhibit 22). Rule 144A bonds: no SEC filing of the offering memorandum"
        where: [us_edgar_fts]
        refs: [us_rel_33_10762, us_regsk_601]
    never_public: "Holders (except fund holdings), private side letters"

  - id: nordic_bond
    name: Nordic bond (Norwegian or Swedish law, trustee Nordic Trustee)
    in_this_sector: "Common for Nordic data-centre operators and growth issuers"
    traces:
      - region: nordics
        status: mandatory
        evidence: law
        trace: "Mandate announcement, pricing announcement, bond terms (often on the issuer's site), listing on Oslo, Stockholm or Frankfurt Open Market; trustee notices for amendments and defaults"
        timing: "Mandate announcement days before pricing; listing within months"
        where: [no_newsweb, se_nasdaq_nordic, no_nordic_trustee, no_stamdata, eu_firds]
        refs: [eu_mar, eu_mifir, nordic_investor_meetings_example, nordic_investor_meetings_example_2]
        note: "The mandate announcement is market practice driven by MAR for already-listed issuers"
    never_public: "Allocation"

  - id: private_notes_listed_for_tax
    name: Private notes listed only for tax reasons (TISE, Euronext Dublin, Vienna MTF)
    in_this_sector: "Direct-lending notes, holdco notes, intra-group notes"
    traces:
      - region: eu
        status: conditional
        evidence: law
        trace: "A listing on a recognised exchange lets interest be paid without UK withholding tax, so private notes get a short listing document and an ISIN"
        where: [ie_euronext_dublin, eu_firds]
        refs: [uk_ita2007_s882, eu_mifir]
    never_public: "Pricing and covenants usually; holders"

  - id: private_placement
    name: Private placement (US private placement notes, Schuldschein, unlisted notes)
    in_this_sector: "Mature data-centre platforms with stable cash flows"
    traces:
      - region: all
        status: none
        evidence: judgement
        trace: "No exchange, no prospectus, no register. Seen only in the borrower's accounts, rating releases (if publicly rated), arranger or law-firm announcements and paid services"
        where: [gl_9fin, gl_ratings]
        refs: [eu_cra]
    never_public: "Investors, pricing, covenants"

  - id: securitisation
    name: Securitisation (data-centre ABS or CMBS)
    in_this_sector: "Stabilised data-centre portfolios"
    traces:
      - region: eu
        status: conditional
        evidence: law
        trace: "Public deals: prospectus and listing; loan-level data goes to repositories for investors and regulators, not the public"
        where: [ie_euronext_dublin, eu_sts]
        refs: [eu_securitisation]
      - region: us
        status: conditional
        evidence: market_practice
        trace: "Rule 144A data-centre ABS: rating agency pre-sale reports are usually published; no SEC registration"
        where: [gl_ratings]
    never_public: "Private securitisations"

  - id: public_lender
    name: Public lender or export credit agency loan or guarantee
    in_this_sector: "EIB, NIB, export credit agencies for equipment exports, state aid"
    traces:
      - region: eu
        status: conditional
        evidence: law
        trace: "State aid above EUR 100,000 is published with the beneficiary (law). Public lenders publish project lists under their own transparency policies (policy, not law; depth varies)"
        where: [eu_eib, eu_ebrd, eu_nib, eu_eca, eu_state_aid, uk_ukef, uk_subsidy]
        refs: [eu_gber, eib_transparency]
    never_public: "Terms"

  - id: fund_held_loan
    name: Loan held by a fund (who the lender is)
    in_this_sector: "Private credit funds holding neocloud and data-centre loans"
    traces:
      - region: us
        status: mandatory
        evidence: regulator
        trace: "BDCs list every investment (borrower, rate, spread, maturity, cost, fair value) in each 10-Q and 10-K, tagged in Inline XBRL"
        timing: "10-Q within 40 to 45 days of quarter end"
        where: [us_bdc]
        refs: [us_regsx_12_12, us_rel_33_10771]
        detect: "edgartools PortfolioInvestments (see docs/related_tools.md)"
      - region: us
        status: conditional
        evidence: regulator
        trace: "Registered funds (mutual, interval, closed-end) report holdings on N-PORT; part is public with a lag"
        where: [us_nport]
        refs: [us_form_nport, us_nport_proposal_2026]
      - region: eu
        status: confidential
        evidence: law
        trace: "European private credit funds report to regulators (AIFMD Annex IV), not the public; ELTIF and listed vehicles publish annual reports"
        where: [lu_cssf, ie_cbi_registers]
        refs: [eu_aifmd, eu_eltif]
      - region: eu
        status: confidential
        evidence: law
        trace: "Euro-area banks report loans loan by loan to central banks (AnaCredit); confidential"
        refs: [ecb_anacredit]
    never_public: "Separately managed accounts, insurers' and pension funds' direct loans, most European funds' holdings"

