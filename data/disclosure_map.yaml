signals:
  - id: spv_incorporated
    stage: pre
    name: New financing-style SPVs incorporated (HoldCo, MidCo, BidCo, PropCo, FinCo, "DC Holdings", "GPU Holdings")
    why: "Lenders want a ring-fenced borrower and a holding company whose shares they can take as security"
    evidence: market_practice
    where: [uk_ch, uk_ch_stream, lu_lbr, no_brreg]
    detect: "watch; search uk <group>"
    lead_time: "Weeks to months before closing"
  - id: psc_link
    stage: pre
    name: New corporate parent link (PSC notification) placing the SPV under the group
    why: "Shows the SPV belongs to the group before any financing filing"
    evidence: law
    where: [uk_ch]
    detect: "watch; company uk <no>"
    lead_time: "Weeks"
  - id: new_lei
    stage: pre
    name: New LEI registered for an SPV, with the group as parent
    why: "Hedging the loan's interest rate needs an LEI for derivatives reporting, and banks ask for one at onboarding"
    evidence: market_practice
    where: [eu_gleif]
    refs: [eu_emir, gleif_golden_copy, gleif_level2]
    detect: "watch; company <jur> <LEI or no>"
    lead_time: "Weeks before closing"
  - id: articles_changed
    stage: pre
    name: New articles or resolutions removing share-transfer restrictions (UK MA, RES01)
    why: "Lenders taking a share charge need to be free to enforce by transferring the shares"
    evidence: market_practice
    where: [uk_ch]
    detect: "watch; company uk <no>"
    lead_time: "Days to weeks; often filed with the MR01"
  - id: bond_mandate
    stage: pre
    name: Bond mandate and investor meetings announced (Nordic market)
    why: "Listed issuers announce a contemplated bond issue; standard practice in the Nordic market"
    evidence: market_practice
    where: [no_newsweb, se_nasdaq_nordic]
    refs: [eu_mar, nordic_investor_meetings_example, nordic_investor_meetings_example_2]
    lead_time: "Days before pricing"
  - id: provisional_rating
    stage: pre
    name: Provisional or expected rating assigned
    why: "Rated bonds, ABS and some private placements get a rating release before closing"
    evidence: market_practice
    where: [gl_ratings]
    refs: [eu_cra]
    lead_time: "Days to weeks"
  - id: paid_service_report
    stage: pre
    name: Deal reported by 9fin, Debtwire, Octus, LoanConnector, PitchBook LCD or IJGlobal
    why: "Journalists report private deals from lenders and sponsors, often before closing"
    evidence: market_practice
    where: [gl_9fin, gl_debtwire, gl_octus, gl_loanconnector, gl_pitchbook_lcd, gl_ijglobal]
    lead_time: "Before to after closing"
  - id: charge_registered
    stage: closing
    name: Charge registered (UK MR01, Irish C1, Nordic pledge registers, US UCC-1)
    why: "Security must be registered to be effective against insolvency officers; the strongest free proof that a secured financing closed"
    evidence: law
    where: [uk_ch, uk_ch_stream, ie_core, no_losore, dk_tinglysning, us_ucc]
    refs: [uk_ca2006_s859a, uk_ca2006_s859h, ie_ca2014_s409, us_ucc9]
    detect: "watch; stream; company uk <no>; sector <preset> --jur uk"
    lead_time: "Within 21 days after closing (UK, Ireland)"
  - id: charge_released
    stage: closing
    name: Charge satisfied or released (UK MR04, MR05)
    why: "A repayment or refinancing: a new charge around the same date usually means the debt was refinanced"
    evidence: law
    where: [uk_ch]
    refs: [uk_ca2006_s859a]
    detect: "watch; company uk <no>"
    lead_time: "At repayment"
  - id: new_isin
    stage: closing
    name: New ISIN for an issuer LEI in FIRDS
    why: "Every bond admitted to an EU venue appears with its issuer LEI"
    evidence: law
    where: [eu_firds]
    refs: [eu_mifir, eu_firds]
    lead_time: "At admission to trading"
  - id: form_8k_203
    stage: closing
    name: 8-K Item 2.03 (new direct financial obligation)
    why: "Required for SEC reporting companies"
    evidence: regulator
    where: [us_edgar_fts]
    refs: [us_form_8k]
    detect: "company us <CIK>; sector <preset> --jur us"
    lead_time: "Within four business days"
  - id: announcements
    stage: closing
    name: Lender, sponsor or law-firm deal announcements and trade press
    why: "Lenders and advisers publicise deals; not required"
    evidence: market_practice
    where: []
    detect: "monitor (news feed); web search"
    lead_time: "At or after closing"
  - id: bdc_position
    stage: after
    name: New position in a BDC schedule of investments
    why: "BDCs list every investment each quarter"
    evidence: regulator
    where: [us_bdc]
    refs: [us_regsx_12_12, us_rel_33_10771]
    detect: "lenders <preset>; lenders --terms <names>"
    lead_time: "40 to 45 days after quarter end"
  - id: accounts_filed
    stage: after
