# Disclosure map: for each kind of debt, what must (or usually does) become public, where, when, and why.
#
# This is the reasoning behind where the tracker looks. Nothing here is hidden in code: commands read this file.
#   python -m tracker where [<instrument>] [--region uk]    traces of an instrument, by region, with legal basis
#   python -m tracker signals [--region uk] [--stage pre]   signs that a financing is coming, happening or done
#   python -m tracker refs [<ref id>]                        the sources behind every claim
#
# Every trace and signal says how sure we are, in `evidence`:
#   law             a statute or regulation requires it (cited in refs)
#   regulator       a regulator's form or rule requires it (cited)
#   market_practice it usually happens because of how the market works, not because a rule requires it
#   judgement       our reading; check before relying on it
# `status`: mandatory (always public if the condition holds) | conditional (only in the stated case) |
#           voluntary | confidential (reported to a regulator, not published) | none
# `where`: source ids from data/source_directory.yaml. `detect`: the tracker command that finds it, if any.
# Facts were checked against the cited texts on 30 Oct 2026 (`checked`).

references:
  uk_ca2006_s859a:
    title: Companies Act 2006, s859A (registration of charges; 21-day period)
    url: https://www.legislation.gov.uk/ukpga/2006/46/section/859A
    supports: "A UK company's charge is registered by delivering a statement of particulars within 21 days of creation"
    checked: 2026-10-30
  uk_ca2006_s859h:
    title: Companies Act 2006, s859H (consequence of failing to register)
    url: https://www.legislation.gov.uk/ukpga/2006/46/section/859H
    supports: "An unregistered charge is void against a liquidator, administrator and creditors: lenders always register"
    checked: 2026-10-30
  uk_ca2006_s442:
    title: Companies Act 2006, s442 (period for filing accounts)
    url: https://www.legislation.gov.uk/ukpga/2006/46/section/442
    supports: "Private companies file accounts within nine months of the year end"
    checked: 2026-10-30
  uk_ca2006_s479a:
    title: Companies Act 2006, s479A (audit exemption with parent guarantee)
    url: https://www.legislation.gov.uk/ukpga/2006/46/section/479A
    supports: "A parent can guarantee a subsidiary's liabilities so the subsidiary skips its audit; the guarantee is filed"
    checked: 2026-10-30
  uk_ita2007_s882:
    title: Income Tax Act 2007, s882 (quoted Eurobond exemption)
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/882
    supports: "Interest on securities listed on a recognised stock exchange can be paid without UK withholding tax: a reason private notes get listed"
    checked: 2026-10-30
  uk_ch_charges_stream:
    title: Companies House Streaming API, charges stream
    url: https://developer-specs.company-information.service.gov.uk/streaming-api/resources/chargesstream
    supports: "Every new or changed UK charge, pushed in real time, including persons entitled"
    checked: 2026-10-30
  ie_ca2014_s409:
    title: Companies Act 2014 (Ireland), s409 (registration of charges)
    url: https://www.irishstatutebook.ie/eli/2014/act/38/section/409/enacted/en/html
    supports: "Irish charges are registered with the CRO within 21 days of creation"
    checked: 2026-10-30
  ie_ca2014_s357:
    title: Companies Act 2014 (Ireland), s357 (parent guarantee for filing exemption)
    url: https://www.irishstatutebook.ie/eli/2014/act/38/section/357/enacted/en/html
    supports: "A parent guarantee lets an Irish subsidiary avoid filing its own accounts"
