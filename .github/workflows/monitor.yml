# Daily primary-source monitor: logs new SEC and Companies House filings about watched groups
# to data/events.csv, commits the log, and opens an issue listing anything new to triage.
#
# Setup (repository Settings > Secrets and variables > Actions):
#   secret   COMPANIES_HOUSE_API_KEY  - free key from developer.company-information.service.gov.uk
#   variable EDGAR_USER_AGENT         - e.g. "Your Name your.email@example.com" (SEC requires a contact)
name: monitor

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Run monitor
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
        run: python -m tracker monitor | tee build_monitor.log
      - name: Commit event log
        run: |
          git config user.name "tracker-monitor"
          git config user.email "tracker-monitor@users.noreply.github.com"
          git add data/events.csv
          git diff --cached --quiet || git commit -m "monitor: new filings $(date -u +%Y-%m-%d)"
          git push
      - name: Open an issue for new filings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "^0 new event" build_monitor.log; then
            gh issue create --title "New filings to triage $(date -u +%Y-%m-%d)" --body-file build/new_events.md
          fi
