<style>
/* One compact page: headline numbers, two collapsible group strips, then tabs. The map tab pairs a single
   US + Europe map with a campus panel; clicking campuses adds them to the selection and the panel totals them. */
:root {
  --bg: #191919; --ink: #d4d4d4; --ink-2: #9b9b9b; --ink-3: #7f7f7f; --line: #2f2f2f; --hover: #262626; --panel: #202020;
  --land: #262626; --land-edge: #3a3a3a; --water: #191919; --accent: #529cca;
  --tag-red-bg: #522e2a; --tag-red-fg: #f4b7ad; --tag-orange-bg: #5c3b23; --tag-orange-fg: #f2c8a3;
  --tag-yellow-bg: #564328; --tag-yellow-fg: #f0d9a8; --tag-green-bg: #243d30; --tag-green-fg: #b6dcc1;
  --tag-gray-bg: #373737; --tag-gray-fg: #d4d4d4; --tag-blue-bg: #143a4e; --tag-blue-fg: #b3d4e8;
  --risk-low: #0ca30c; --risk-medium: #fab219; --risk-high: #ec835a; --risk-critical: #d03b3b; --risk-terminated: #9b9a97; --risk-unrated: #b4b3af;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919; --ink: #d4d4d4; --ink-2: #9b9b9b; --ink-3: #7f7f7f; --line: #2f2f2f; --hover: #262626; --panel: #202020;
    --land: #262626; --land-edge: #3a3a3a; --water: #191919; --accent: #529cca;
    --tag-red-bg: #522e2a; --tag-red-fg: #f4b7ad; --tag-orange-bg: #5c3b23; --tag-orange-fg: #f2c8a3;
    --tag-yellow-bg: #564328; --tag-yellow-fg: #f0d9a8; --tag-green-bg: #243d30; --tag-green-fg: #b6dcc1;
    --tag-gray-bg: #373737; --tag-gray-fg: #d4d4d4; --tag-blue-bg: #143a4e; --tag-blue-fg: #b3d4e8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191919; --ink: #d4d4d4; --ink-2: #9b9b9b; --ink-3: #7f7f7f; --line: #2f2f2f; --hover: #262626; --panel: #202020;
  --land: #262626; --land-edge: #3a3a3a; --water: #191919; --accent: #529cca;
  --tag-red-bg: #522e2a; --tag-red-fg: #f4b7ad; --tag-orange-bg: #5c3b23; --tag-orange-fg: #f2c8a3;
  --tag-yellow-bg: #564328; --tag-yellow-fg: #f0d9a8; --tag-green-bg: #243d30; --tag-green-fg: #b6dcc1;
  --tag-gray-bg: #373737; --tag-gray-fg: #d4d4d4; --tag-blue-bg: #143a4e; --tag-blue-fg: #b3d4e8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13.5px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 32px; }
.page { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.top .sub { color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12.5px; padding: 3px 9px; border-radius: 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
.top { padding-top: 14px; }
.wm { font-size: 11.5px; color: var(--ink-2); border-left: 3px solid var(--tag-red-bg); padding: 2px 8px; }
.wm b { color: var(--tag-red-fg); }
.wm summary { cursor: pointer; list-style: none; } .wm summary::-webkit-details-marker { display: none; }
.wm summary::after { content: " · full disclaimer"; color: var(--ink-3); }
.wm[open] summary::after { content: ""; }
.wm-corner { position: fixed; top: 6px; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 60; pointer-events: none; font-size: 10.5px; font-weight: 600;
  color: var(--tag-red-fg); background: color-mix(in srgb, var(--bg) 88%, transparent); border: 1px solid var(--tag-red-bg); border-radius: 4px; padding: 2px 7px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 6px; }
.kpi { padding: 7px 12px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .k { font-size: 11.5px; color: var(--ink-2); }
.kpi .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi .n { font-size: 11px; color: var(--ink-3); }
.kpi .pct { font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.kpi .small-v { font-size: 15px; }
.kpi .bar { height: 5px; border-radius: 3px; background: var(--hover); overflow: hidden; margin-top: 3px; }
.kpi .bar i { display: block; height: 100%; background: var(--accent); }
.kpi .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); }
details.fold { border: 1px solid var(--line); border-radius: 6px; }
details.fold > summary { cursor: pointer; padding: 7px 12px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--ink-3); font-size: 11px; }
details.fold[open] > summary::before { content: "▾"; }
details.fold > summary b { font-weight: 600; white-space: nowrap; }
details.fold > summary span { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
details.fold > .body { padding: 4px 12px 10px; }
.conc { display: flex; flex-direction: column; gap: 4px; max-width: 760px; margin-bottom: 8px; }
.conc .row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 150px; gap: 10px; align-items: center; font-size: 12.5px; }
.conc .track { height: 12px; background: var(--hover); border-radius: 0 4px 4px 0; overflow: hidden; display: flex; }
.conc .track i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.conc .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; font: inherit; color: var(--ink-2); padding: 7px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
.tb-btn { border: 1px solid var(--line); background: transparent; color: var(--ink-2); font: inherit; font-size: 12.5px; padding: 3px 9px; border-radius: 4px; cursor: pointer; }
.tb-btn:hover, .tb-btn[aria-expanded="true"] { background: var(--hover); }
.dd { position: relative; }
.pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; width: 270px; max-height: 330px; overflow: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(15,15,15,0.12); padding: 6px; }
.pop input[type="search"] { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px; padding: 5px 8px; font: inherit; margin-bottom: 4px; }
.opt { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
.opt:hover { background: var(--hover); } .opt input { accent-color: var(--accent); margin: 0; }
.hint { color: var(--ink-3); font-size: 12px; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.mapbox { border: 1px solid var(--line); border-radius: 6px; position: relative; overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; background: var(--water); }
.land { fill: var(--land); stroke: var(--land-edge); stroke-width: 0.5; }
.states { fill: none; stroke: var(--land-edge); stroke-width: 0.35; }
.site { cursor: pointer; }
.site circle.mark { stroke: var(--bg); stroke-width: 1.5; }
.site.terminated circle.mark { fill: none !important; stroke: var(--risk-terminated); stroke-dasharray: 3 2; stroke-width: 1.5; }
.site.unknown circle.mark { stroke: var(--ink-3); stroke-dasharray: 2 2; }
.site circle.ring { fill: none; stroke: none; }
.site.sel circle.ring { stroke: var(--ink); stroke-width: 1.8; }
.site text { font-size: 10.5px; fill: var(--ink); paint-order: stroke; stroke: var(--water); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.site.sel text { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11.5px; color: var(--ink-2); padding: 6px 10px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.sw.terminated { background: transparent !important; border: 1.5px dashed var(--risk-terminated); }
.panel { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; max-height: 452px; overflow: auto; min-width: 0; }
@media (max-width: 900px) { .panel { max-height: none; } }
.panel h3 { font-size: 16px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sec { border-top: 1px solid var(--line); margin-top: 6px; }
.sec > summary { cursor: pointer; padding: 6px 0 4px; font-weight: 600; font-size: 12.5px; list-style: none; display: flex; gap: 6px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: "▸"; color: var(--ink-3); font-weight: 400; }
.sec[open] > summary::before { content: "▾"; }
.sec > summary .gist { font-weight: 400; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sec .item { padding: 4px 0 6px; } .sec .item + .item { border-top: 1px dashed var(--line); }
.sec .h { font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
.c { margin-bottom: 4px; font-size: 12.5px; } .c .k { display: block; color: var(--ink-2); font-size: 11px; font-weight: 600; }
.proxy { font-size: 11.5px; color: var(--ink-3); font-style: italic; }
.tag { display: inline-flex; align-items: center; border-radius: 3px; padding: 0 6px; font-size: 12px; line-height: 19px; white-space: nowrap; font-weight: 400; }
.tag.red { background: var(--tag-red-bg); color: var(--tag-red-fg); } .tag.orange { background: var(--tag-orange-bg); color: var(--tag-orange-fg); }
.tag.yellow { background: var(--tag-yellow-bg); color: var(--tag-yellow-fg); } .tag.green { background: var(--tag-green-bg); color: var(--tag-green-fg); }
.tag.gray { background: var(--tag-gray-bg); color: var(--tag-gray-fg); } .tag.blue { background: var(--tag-blue-bg); color: var(--tag-blue-fg); }
.g { display: inline-block; font-size: 9.5px; font-weight: 600; line-height: 13px; padding: 0 4px; border-radius: 3px; margin-left: 4px;
  background: var(--tag-gray-bg); color: var(--tag-gray-fg); text-decoration: none; vertical-align: 1px; }
.g.A { background: var(--tag-blue-bg); color: var(--tag-blue-fg); }
.gap { color: var(--ink-3); }
.db { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.tabpanel table { min-width: 860px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th + th, td + td { border-left: 1px solid var(--line); }
th { color: var(--ink-2); font-weight: 400; font-size: 12px; white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--hover); }
tr.total td { font-weight: 600; }
td.clauses { min-width: 230px; } td.clauses details summary { cursor: pointer; color: var(--ink-2); font-size: 11.5px; }
.small { font-size: 12px; color: var(--ink-2); }
.x { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font: inherit; padding: 0 4px; }
.note { color: var(--ink-2); font-size: 12px; display: flex; flex-direction: column; gap: 4px; max-width: 110ch; }
.note p { margin: 0; }
a { color: inherit; text-decoration-color: var(--ink-3); }
[hidden] { display: none !important; }
.wm-corner .short { display: none; }
@media (max-width: 640px) {
  body { font-size: 13px; padding-block: 14px 24px; }
  h1 { font-size: 20px; }
  .top { padding-top: 22px; }
  .top .sub { flex-basis: 100%; order: 3; font-size: 12px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 0; border-top: 1px solid var(--line); }
  .kpi:nth-child(-n+2) { border-top: 0; } .kpi:nth-child(even) { border-left: 1px solid var(--line); }
  .kpi:last-child { grid-column: 1 / -1; border-left: 0; }
  .kpi .v { font-size: 17px; } .kpi .pct { display: block; white-space: normal; }
  details.fold > summary { flex-wrap: wrap; } details.fold > summary span { white-space: normal; }
  .toolbar .hint { display: none; }
  .seg button { padding: 4px 8px; }
  .site text { font-size: 21px; stroke-width: 5px; }
  .legend { font-size: 11px; }
  .conc .row { grid-template-columns: 80px minmax(0, 1fr) 105px; }
  .pop { width: min(270px, 86vw); }
  .wm-corner .full { display: none; } .wm-corner .short { display: inline; }
  .kv { grid-template-columns: 96px minmax(0, 1fr); }
}
</style>

    </div>
  </section>
  <section id="p-cust" role="tabpanel" aria-labelledby="t-cust" class="tabpanel" hidden><div class="db"><table id="custs"></table></div></section>
  <section id="p-up" role="tabpanel" aria-labelledby="t-up" class="tabpanel" hidden><p class="small" id="up-sub"></p><div class="db"><table id="ups"></table></div></section>
  <section id="p-terms" role="tabpanel" aria-labelledby="t-terms" class="tabpanel" hidden><p class="small" id="terms-sub"></p><div class="db"><table id="terms"></table></div></section>

  <div class="note" id="method"></div>
</div>

// ---- per-campus derived figures (recomputed when the source filter changes) ----
const facCount = {};
D.sites.forEach(s => s.facilities.forEach(f => facCount[f.id] = (facCount[f.id] || 0) + 1));
function derive() {
  D.sites.forEach(s => {
    s.mw = num(s.mw_contracted); s.act = num(s.mw_energized);
    s.debtOwn = d3.sum(s.facilities.filter(f => facCount[f.id] === 1), f => num(f.amount_max) || 0);
    s.shared = s.facilities.filter(f => facCount[f.id] > 1);
    const live = s.contracts.filter(c => has(c.value_total) && !/terminated|in_negotiation/.test(firstText(c.status) || ""));
    s.value = live.length ? d3.sum(live, c => num(c.value_total)) : null;
    s.terminated = s.risk === "terminated";
  });
}
function totals(list) {
  const shared = {};
  list.forEach(s => s.shared.forEach(f => shared[f.id] = f));
  return { n: list.length,
    mw: d3.sum(list, s => s.mw || 0), mwKnown: list.filter(s => s.mw != null).length,
    act: d3.sum(list, s => s.act || 0), actKnown: list.filter(s => s.act != null).length,
    debt: d3.sum(list, s => s.debtOwn) + d3.sum(Object.values(shared), f => num(f.amount_max) || 0), sharedN: Object.keys(shared).length,
    value: d3.sum(list, s => s.value || 0), valueKnown: list.filter(s => s.value != null).length,
    both: list.filter(s => s.mw && s.act != null).length, mwBoth: d3.sum(list.filter(s => s.mw && s.act != null), s => s.mw),
    actBoth: d3.sum(list.filter(s => s.mw && s.act != null), s => s.act) };
}

function kpi(group, k, f, fmt, note) {

  const v = g.values ? fmt(g.values[0]) + grade(g.values[0]) : `<span class="gap" style="font-size:13px;font-weight:400">${g.status === "hidden" ? "News only" : "Not disclosed"}</span>`;
  return `<div class="kpi"><div class="grp">${group}</div><div class="k">${k}</div><div class="v">${v}</div><div class="n">${note || ""}</div></div>`;
}
function renderKpis() {
  const mw = n => n >= 1000 ? (n / 1000).toFixed(2).replace(/\.?0+$/, "") + " GW" : (+n).toLocaleString() + " MW";
  const pct = p => (p < 10 ? p.toFixed(1) : p.toFixed(0)) + "%";
  // value (share of base), e.g. "55 MW (4.0% of contracted)"; share uses the weaker grade of the two inputs
  const tile = (grp, k, f, fmt, base, baseLabel, note) => {
    const A = F(f), B = base ? F(base) : null;
    const val = A.values ? `${esc(fmt(A.values[0].number))}${grade(A.values[0])}` :
      `<span class="gap" style="font-size:13px;font-weight:400">${A.status === "hidden" ? "News only" : "Not disclosed"}</span>`;
    let share = "", bar = "";
    if (A.values && B && B.values) {
      const p = A.values[0].number / B.values[0].number * 100;
      share = `<span class="pct">(${pct(p)} of ${baseLabel})</span>`;
      bar = `<div class="bar" role="img" aria-label="${pct(p)} of ${baseLabel}"><i style="width:${Math.min(100, p)}%"></i></div>`;
    } else if (A.values) share = `<span class="pct">(${baseLabel}: not disclosed)</span>`;
    return `<div class="kpi"><div class="grp">${grp}</div><div class="k">${k}</div><div class="v">${val} ${share}</div>${bar}<div class="n">${note || ""}</div></div>`;
  };
  document.getElementById("kpis").innerHTML =
    tile("Capacity", "Active MW", G.mw_energized_total, mw, G.mw_contracted_total, "contracted", state.primary ? "IPO filing gives no active MW" : "Press, citing the IPO filing") +
    tile("Capacity", "Contracted MW (active + contracted)", G.mw_contracted_total, mw, G.mw_potential, "~10 GW planned", "Planned = pipeline with line of sight, per the S-1") +
    tile("Revenue", "Active contract value", G.tcv_active, money, G.tcv_active_and_contracted, "contracted", "Revenue-generating today") +
    tile("Revenue", "Contracted value (active + contracted)", G.tcv_active_and_contracted, money, null, "planned", "Total backlog, 31 Aug 2026; no planned figure disclosed") +
    `<div class="kpi"><div class="grp">Scale</div><div class="k">GPUs · sites (active / contracted)</div><div class="v small-v">${show(G.gpus_active, v => esc((+v.number).toLocaleString()))} / ${esc((num(G.gpus_active_and_contracted) / 1000).toFixed(0))}k</div>
      <div class="n">${show(G.sites_active, v => esc(v.number))} / ${esc(num(G.sites_contracted))} sites</div></div>`;
}

const svg = d3.select("#map"), W = 960, H = 470;
const world = topojson.feature(D.geo.world, D.geo.world.objects.countries);
const statesMesh = topojson.mesh(D.geo.us, D.geo.us.objects.states, (a, b) => a !== b);
const EXTENT = { all: [[-108, 27], [40, 70]], us: [[-110, 26], [-70, 46]], eu: [[-26, 35], [28, 70]] };
const LABEL = {   // label placement per campus: [dx, dy, anchor]

  site_borealis: [-10, 4, "end"], site_loughton: [-10, 4, "end"], site_sin01: [-10, 12, "end"], site_sin02: [-10, -2, "end"],

};
const gLand = svg.append("g"), gSites = svg.append("g");
let proj;
function drawBase() {
  const corners = EXTENT[state.region];
  proj = d3.geoMercator().fitExtent([[24, 18], [W - 24, H - 18]], { type: "MultiPoint", coordinates: corners });
  const path = d3.geoPath(proj);
  gLand.selectAll("*").remove();
  gLand.append("path").datum(world).attr("class", "land").attr("d", path);
  gLand.append("path").datum(statesMesh).attr("class", "states").attr("d", path);
}
const radius = s => s.mw ? Math.max(6, d3.scaleSqrt().domain([0, d3.max(D.sites, x => x.mw || 0)]).range([0, 22])(s.mw)) : 7;
const inRegion = s => state.region === "all" || s.region === state.region;
function renderMap() {

  const g = gSites.selectAll("g.site").data(data, d => d.id).join(enter => {
    const e = enter.append("g").attr("tabindex", 0).attr("role", "button");
    e.append("circle").attr("class", "ring"); e.append("circle").attr("class", "mark"); e.append("text");
    e.on("click", (ev, d) => toggle(d.id)).on("keydown", (ev, d) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(d.id); } });
    e.append("title");

   .attr("transform", d => { const [x, y] = proj([d.lon, d.lat]); return `translate(${x},${y})`; });

  g.select("circle.ring").attr("r", d => radius(d) + 4);

const clause = (label, f) => {
  const g = F(f); if (!g || !g.values) return "";
  return `<div class="c">${label ? `<span class="k">${label}</span>` : ""}${g.values.map(v => esc(v.text) + grade(v)).join("<br>")}</div>`;
};
const sec = (title, gist, body) => `<details class="sec"><summary>${title}<span class="gist">${gist ? "· " + gist : ""}</span></summary>${body || '<div class="gap c">Nothing disclosed in the sources tracked.</div>'}</details>`;
const upOf = id => D.upstream.find(u => u.site === id) || {};
function campusDetail(s) {
  const u = upOf(s.id), L = u.lease, cp = u.counterparty;
  const status = F(s.construction_status);
  const actPct = s.mw && s.act != null ? ` <span class="small">(${(s.act / s.mw * 100).toFixed(0)}% of contracted)</span>` : "";
  const notes = [s.mw_contracted, s.mw_energized, s.ownership].map(F).filter(f => f && f.values).flatMap(f => f.values.map(v => v.note)).filter(Boolean);
  let h = `<h3>${esc(s.label)} ${riskTag(s.risk)}</h3><dl class="kv">
    <dt>Region</dt><dd>${REGIONS[s.region]}</dd>
    <dt>Ownership</dt><dd>${show(s.ownership, x => words(x.text))}</dd>
    <dt>Contracted</dt><dd>${show(s.mw_contracted, x => esc(fmtMW(x.number)))}</dd>
    <dt>Active</dt><dd>${show(s.mw_energized, x => esc(fmtMW(x.number)))}${actPct}</dd>
    <dt>Build status</dt><dd>${status.values ? esc(status.values[0].text) + grade(status.values[0]) : show(s.construction_status)}</dd>
    ${notes.length ? `<dt>Notes</dt><dd class="small">${notes.map(esc).join("<br>")}</dd>` : ""}</dl>`;
  // Customer
  const ctrs = s.contracts.map(c => `<div class="item"><div class="h">${esc(c.name)}</div><dl class="kv">
      <dt>Customer</dt><dd>${show(c.customer)}</dd><dt>Value</dt><dd>${show(c.value_total, x => esc(money(x.number) ?? x.text))}</dd>
      <dt>Status</dt><dd>${show(c.status, x => words(x.text))}</dd>${has(c.gpu_count) ? `<dt>GPUs</dt><dd>${show(c.gpu_count, x => esc((+x.number).toLocaleString()))} ${has(c.gpu_type) ? esc(firstText(c.gpu_type)) : ""}</dd>` : ""}
      ${has(c.take_or_pay) ? `<dt>Take-or-pay</dt><dd>${show(c.take_or_pay, x => x.text === "true" ? "Yes" : "No, pays on delivery")}</dd>` : ""}

  // Data centre provider

    (L ? clause("Type", L.lease_type) + clause("Size", L.mw) + clause("Start", L.start_date) + clause("Term (months)", L.term_months) : "") +
    (has(s.operator) ? clause("Operator", s.operator) : "") +
    (cp ? clause(`${cp.name} depends on Nscale`, cp.dependency) : "") + (u.supplier ? clause(`${u.supplier.name}`, u.supplier.dependency) : "");
  h += sec("Data centre provider", cp ? cp.name : (firstText(u.ownership) ? words(firstText(u.ownership)) + "; provider not named" : ""), prov.trim() ? prov : "");

    clause("Target online", s.energization_target_date) + clause("GPUs deployed", s.gpus_deployed) +
    lt.lender.map(f => clause(`Loan deadline (${f.facility})`, f.completion_test)).join("");
  h += sec("Build status", status.values ? status.values[0].text.split(";")[0] : "", build);
  // Debt
  const debt = s.facilities.map(f => `<div class="item"><div class="h">${esc(f.name)}${facCount[f.id] > 1 ? ' <span class="small">(shared with another campus)</span>' : ""}</div><dl class="kv">
      <dt>Size</dt><dd>${show(f.amount_max, x => esc(money(x.number)))}</dd><dt>Drawn</dt><dd>${show(f.amount_drawn, x => esc(money(x.number)))}</dd>
      <dt>Margin</dt><dd>${show(f.margin_bps, x => esc(x.number != null ? "+" + x.number + " bps" : x.text))}</dd><dt>Maturity</dt><dd>${show(f.maturity_date)}</dd>

    clause("Still owed to seller", u.deferred_consideration_outstanding && { ...u.deferred_consideration_outstanding, values: u.deferred_consideration_outstanding.values && u.deferred_consideration_outstanding.values.map(v => ({ ...v, text: money(v.number) })) }) +

  h += sec("Cost structure", has(u.acquisition_cost) ? "owned, bought for " + money(num(u.acquisition_cost)) : (L ? firstText(L.lease_type) : ""), cost);
  // Termination and force majeure
  const term = lt.customer.map(c => (c.proxy ? `<div class="proxy">${esc(c.customer)}: site contract not filed; terms of the filed ${esc(c.proxy)}</div>` : `<div class="h">${esc(c.customer || c.contract)}</div>`) +

  h += sec("Termination and force majeure", lt.customer.length || lt.lender.length ? "contract and loan clauses" : "", term);
  return h;
}
function aggregate(list, title) {
  const t = totals(list), mix = d3.rollup(list, v => v.length, s => s.risk);

    <dt>Campuses</dt><dd>${t.n} · ${[...mix].sort((a, b) => RISK[a[0]].order - RISK[b[0]].order).map(([k, n]) => `${riskTag(k)} ${n}`).join(" ")}</dd>
    <dt>Contracted</dt><dd>${t.mw.toLocaleString()} MW <span class="small">(${t.mwKnown} of ${t.n} disclose)</span></dd>
    <dt>Active</dt><dd>${t.act.toLocaleString()} MW ${t.both ? `<span class="small">(${(t.actBoth / t.mwBoth * 100).toFixed(t.actBoth / t.mwBoth < 0.1 ? 1 : 0)}% of contracted, where both disclosed)</span>` : ""} <span class="small">(${t.actKnown} of ${t.n} disclose)</span></dd>
    <dt>Campus debt</dt><dd>${money(t.debt) || "–"} <span class="small">committed${t.sharedN ? ", incl. shared Dell bridge" : ""}</span></dd>
    <dt>Contract value</dt><dd>${money(t.value) || "–"} <span class="small">(${t.valueKnown} of ${t.n} disclose)</span></dd></dl>
    <div class="db" style="margin-top:8px"><table><thead><tr><th>Campus</th><th>Risk</th><th>Contracted</th><th>Active</th><th>Debt</th>${state.sel.size ? "<th></th>" : ""}</tr></thead><tbody>${list.sort((a, b) => RISK[a.risk].order - RISK[b.risk].order).map(s =>
      `<tr class="click" data-id="${s.id}"><td>${esc(s.label.split(",")[0])}</td><td>${riskTag(s.risk)}</td><td class="num">${s.mw != null ? s.mw.toLocaleString() : '<span class="gap">n/d</span>'}</td>
       <td class="num">${s.act != null ? s.act.toLocaleString() : '<span class="gap">n/d</span>'}</td><td class="num">${s.debtOwn ? money(s.debtOwn) : "–"}${s.shared.length ? '<span class="small"> +Dell</span>' : ""}</td>
       ${state.sel.size ? `<td><button class="x" data-rm="${s.id}" aria-label="Remove ${esc(s.label)}">×</button></td>` : ""}</tr>`).join("")}</tbody></table></div>`;
}
function renderPanel() {
  const p = document.getElementById("panel");
  const sel = D.sites.filter(s => state.sel.has(s.id));
  if (sel.length === 1) p.innerHTML = campusDetail(sel[0]) + '<p class="small" style="margin:8px 0 0">Click more campuses to total them.</p>';
  else if (sel.length > 1) p.innerHTML = aggregate(sel, `${sel.length} campuses selected`);
  else p.innerHTML = aggregate(D.sites.filter(inRegion), state.region === "all" ? "All campuses" : REGIONS[state.region]) +
    '<p class="small" style="margin:8px 0 0">Click a campus on the map, or a row above, for its details.</p>';
  p.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = e => { if (e.target.dataset.rm) return; if (!state.sel.size) { state.sel.add(tr.dataset.id); renderMap(); renderPanel(); syncCampusBtn(); } });
  p.querySelectorAll("[data-rm]").forEach(b => b.onclick = e => { e.stopPropagation(); toggle(b.dataset.rm); });
}

// ---- tab: customers ----
function renderCustTab() {
  const T = TCV();
  document.getElementById("custs").innerHTML = "<thead><tr><th>Customer</th><th>Contracted value</th><th>Campuses</th><th>Pays if not delivered?</th><th>Runs to</th><th>Can walk if</th><th>Financing</th></tr></thead><tbody>" +
    custRows().map(({ c, h, v }) => {
      const other = c.contracts.filter(x => x.id !== h.id && has(x.status)).map(x => `<div class="small">${esc(x.name)} · ${words(firstText(x.status))}${grade(F(x.status).values[0])}</div>`).join("");
      return `<tr><td style="min-width:200px"><b>${esc(c.name)}</b><div class="small">${esc(h.name)}</div>${other}</td>
        <td class="num">${v != null ? money(v) + grade(F(h.value_total).values[0]) + `<div class="small">${(v / T * 100).toFixed(0)}% of backlog</div>` : '<span class="gap">Not disclosed</span>'}</td>
        <td style="min-width:140px">${c.sites.length ? c.sites.map(id => esc(siteName(id))).join(", ") : '<span class="gap">No campus named</span>'}</td>
        <td>${has(h.take_or_pay) ? show(h.take_or_pay, x => x.text === "true" ? "Yes, take-or-pay" : "No, on delivery") : show(h.take_or_pay)}</td>
        <td>${has(h.end_date) ? show(h.end_date) : show(h.term_months, x => esc(x.number + " months"))}${has(h.extension_rights) ? `<div class="small">${esc(firstText(h.extension_rights))}</div>` : ""}</td>
        <td class="clauses">${clause("", h.termination_rights) || show(h.termination_rights)}</td><td>${show(h.financing_status, x => words(x.text))}</td></tr>`;
    }).join("") + "</tbody>";
}
// ---- tab: lessors and upstream ----
function renderUpTab() {
  document.getElementById("up-sub").innerHTML = `Group operating lease liabilities ${show(D.group_lease.operating_lease_liabilities, x => esc(money(x.number)))}, plus ${show(D.group_lease.leases_not_commenced, x => esc(money(x.number)))} of colocation leases signed but not yet started (30 June 2026).`;
  document.getElementById("ups").innerHTML = "<thead><tr><th>Campus</th><th>How held</th><th>Upstream counterparty</th><th>Key terms</th><th>Credit support</th><th>Who depends on whom</th></tr></thead><tbody>" +
    D.upstream.map(u => {
      const L = u.lease, cp = u.counterparty;
      const terms = L ? clause("Type", L.lease_type) + clause("Size", L.mw) + clause("Start", L.start_date) + clause("Term (months)", L.term_months)
        : clause("Bought for", u.acquisition_cost) + clause("Still owed to seller", u.deferred_consideration_outstanding);
      const support = L ? clause("Guarantor", L.guarantor) + clause("Guarantee", L.guarantee_amount) + clause("For", L.guarantee_term) + clause("Escrow", L.escrow_amount) + clause("Obligation", L.expansion_obligation) : "";
      const dep = (cp ? clause(cp.name, cp.dependency) : "") + (u.supplier ? clause(u.supplier.name, u.supplier.dependency) : "") + (L ? clause("Landlord revenue from the lease, 6 months", L.landlord_revenue_6m) : "");
      return `<tr><td>${esc(siteName(u.site))}</td><td>${show(u.ownership, x => words(x.text))}</td>
        <td>${cp ? esc(cp.name) + (L ? `<div class="small">${esc(L.name)}</div>` : "") : has(u.landlord) ? show(u.landlord) : '<span class="gap">Not named in filings</span>'}</td>
        <td class="clauses">${terms || '<span class="gap">Not disclosed</span>'}</td><td class="clauses">${support || '<span class="gap">None disclosed</span>'}</td>
        <td class="clauses">${dep || '<span class="gap">Not disclosed</span>'}</td></tr>`;
    }).join("") + "</tbody>";
}
// ---- tab: construction risk terms ----
function renderTermsTab() {
  const rcf = F(D.rcf_cross_default);
  document.getElementById("terms-sub").innerHTML = `What lateness costs, when the customer can walk, and what the campus lender can then do. Group revolver: ${rcf.values ? rcf.values.map(v => esc(v.text) + grade(v)).join("; ") : show(D.rcf_cross_default)}`;
  document.getElementById("terms").innerHTML = "<thead><tr><th>Campus</th><th>Customer: paid from, if late, can walk</th><th>Lender: deadline, if customer walks, cash trap</th><th>Backstops and reserves</th></tr></thead><tbody>" +
    D.sites.slice().sort((a, b) => RISK[a.risk].order - RISK[b.risk].order).map(s => {
      const L = s.late;
      const cust = L.customer.length ? L.customer.map(c => (c.proxy ? `<div class="proxy">${esc(c.customer)}: terms of the filed ${esc(c.proxy)}</div>` : "") +
        clause("Paid from", c.payment_start) + clause("If late", c.delay_remedy) + clause("Can walk if", c.delay_termination) + clause("Financing condition", c.financing_condition)).join("") : '<span class="gap">Customer contract not filed</span>';
      const lend = L.lender.length ? L.lender.map(f => `<div class="small"><b>${esc(f.facility)}</b></div>` + clause("Deadline", f.completion_test) + clause("If the customer walks", f.if_customer_terminates) + clause("Cash trap", f.cash_trap) + clause("Overruns", f.cost_overrun_funding)).join("") : '<span class="gap">No campus loan, or terms not filed</span>';
      const back = L.lender.map(f => clause("", f.sponsor_support) + clause("", f.reserves)).join("") || '<span class="gap">None disclosed</span>';
      return `<tr><td style="min-width:130px">${esc(s.label)}<div style="margin-top:3px">${riskTag(s.risk)}</div></td><td class="clauses">${cust}</td><td class="clauses">${lend}</td><td class="clauses">${back}</td></tr>`;
    }).join("") + "</tbody>";
}

// ---- tabs ----
const TABS = { map: "p-map", cust: "p-cust", up: "p-up", terms: "p-terms" };
document.querySelectorAll('[role="tab"]').forEach(b => b.onclick = () => {
  const key = b.id.slice(2); state.tab = key;
  document.querySelectorAll('[role="tab"]').forEach(x => x.setAttribute("aria-selected", x === b));
  Object.entries(TABS).forEach(([k, id]) => document.getElementById(id).hidden = k !== key);
});
// ---- source toggle ----
["src-primary", "src-all"].forEach(id => document.getElementById(id).onclick = () => {
  state.primary = id === "src-primary";
  document.getElementById("src-primary").setAttribute("aria-pressed", state.primary);
  document.getElementById("src-all").setAttribute("aria-pressed", !state.primary);
  renderAll();
});
document.getElementById("method").innerHTML = `
  <p><b>Sources.</b> Every figure is a sourced statement with a grade that links to its document: <span class="g A">A</span> filing, registry or counterparty filing; <span class="g">B</span> company release or filing aggregator; <span class="g">C</span> news. "Filings &amp; company only" hides C. "Not disclosed": the source was checked and is silent.</p>
  <p><b>Construction risk ranking</b> is the author's assessment of each campus's build stage and dependencies; it is the only non-sourced item on the page. Circles sit at town-level locations; Asia-Pacific (14 registered subsidiaries, no disclosed campus) is not mapped.</p>`;

function renderAll() { derive(); renderKpis(); renderCustStrip(); renderCorp(); renderMap(); renderPanel(); renderCustTab(); renderUpTab(); renderTermsTab(); }
renderAll();
</script>
